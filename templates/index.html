
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Spy | Intelligence System</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="particles" id="particles"></div>

<header>
    <h2>✦ GOLDEN SPY</h2>
    <span class="status">● INTELLIGENCE SYSTEM ONLINE</span>
</header>

<main>
    <section class="hero">
        <div class="shadow">🕵</div>
        <p class="eyebrow">CLASSIFIED INTELLIGENCE PLATFORM</p>
        <h1>Uncover The <span>Unknown.</span></h1>
        <p>Investigate information gaps. Discover hidden conflicts. Verify the truth.</p>
    </section>

    <section class="investigation">
        <h2>⌕ Start Investigation</h2>

        <label>Research Question</label>
        <textarea id="question" placeholder="What information do you want to investigate?"></textarea>

        <label>Source URLs</label>
        <div id="url-list">
            <input class="source-url" type="url" placeholder="https://example.com">
        </div>

        <button id="add-source" type="button">+ Add Source</button>
        <button id="investigate" type="button">✦ INITIATE INVESTIGATION</button>

        <p id="status"></p>
    </section>

    <section id="results" hidden>
        <h2>Investigation Report</h2>
        <div id="report"></div>
    </section>
</main>

<footer>GOLDEN SPY © 2026 | THINK BEYOND THE SHADOWS</footer>

<script src="/static/js/script.js"></script>
</body>
</html>
